name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"

  workflow_call:
    inputs:
      ref:
        description: Git ref to check out
        required: false
        type: string
        default: ""

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm audit --audit-level=high

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [22, 24]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - if: matrix.node-version != 22
        run: pnpm test
      - if: matrix.node-version == 22
        run: pnpm run test:browser
      - if: matrix.node-version == 22
        run: pnpm run test:coverage

  package:
    name: Validate npm package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm pack --pack-destination dist
      - name: Verify built package loads
        run: pnpm run verify:package
      - name: Lint package metadata
        run: npx --yes publint
      - name: Verify installed tarball
        shell: bash
        run: |
          set -euo pipefail
          package=$(realpath dist/*.tgz)
          smoke_dir=$(mktemp -d)
          cd "$smoke_dir"
          npm init -y
          npm install --ignore-scripts "$package"
          node --input-type=module -e "import('corriere')"
          node -e "require('corriere')"
      - run: (cd dist && sha256sum *.tgz > SHA256SUMS)
      - uses: actions/upload-artifact@v6
        with:
          name: npm-package
          path: dist/
          if-no-files-found: error
          retention-days: 7
