name: Publish to npmjs

on:
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Which tag or branch to publish?'
        required: true
        default: 'main'
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  id-token: write

jobs:
  quality:
    name: Verify before publish
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.inputs.publish_tag }}

  publish-npm:
    name: Publish unscoped to npmjs
    runs-on: ubuntu-24.04
    needs: quality
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.publish_tag }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Verify built package loads
        run: pnpm run verify:package
      - run: pnpm publish --access public --provenance --no-git-checks
