<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>Corriere Logo</title>
  <defs>
    <linearGradient id="corriere-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="corriere-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="corriere-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="108" fill="url(#corriere-bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="url(#corriere-accent)" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Target & Stream Geometry -->
  <g transform="translate(256, 256)">
    <!-- Outer Target Ring -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="url(#corriere-accent)" stroke-width="12" stroke-dasharray="240 40 80 40" stroke-linecap="round"/>
    
    <!-- Middle Orbit Ring -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="#38BDF8" stroke-width="8" stroke-opacity="0.4" stroke-dasharray="12 12"/>
    
    <!-- Concentric Target Ring -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#8B5CF6" stroke-width="10" filter="url(#glow)"/>
    
    <!-- Center Bulls-eye -->
    <circle cx="0" cy="0" r="28" fill="#EC4899" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="12" fill="#FFFFFF"/>

    <!-- HTTP Request / Response Arrow Rays -->
    <!-- Incoming Request Arrow -->
    <g transform="rotate(-45)">
      <path d="M -190 0 L -120 0" stroke="#38BDF8" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
      <polygon points="-110,0 -130,-12 -130,12" fill="#38BDF8"/>
    </g>
    <!-- Outgoing Response Arrow -->
    <g transform="rotate(135)">
      <path d="M -190 0 L -120 0" stroke="#EC4899" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
      <polygon points="-110,0 -130,-12 -130,12" fill="#EC4899"/>
    </g>
  </g>
</svg>
