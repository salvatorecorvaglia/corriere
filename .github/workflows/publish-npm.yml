name: Publish to npmjs

on:
  workflow_dispatch:
    inputs:
      publish_tag:
        description: "Which tag or branch to publish?"
        required: true
        default: "main"

permissions:
  contents: read

jobs:
  quality:
    name: Verify before publish
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.inputs.publish_tag }}

  publish-npm:
    name: Publish unscoped to npmjs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: quality
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.publish_tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: dist
      - run: (cd dist && sha256sum --check SHA256SUMS)
      - run: npm publish ./dist/*.tgz --access public --provenance
