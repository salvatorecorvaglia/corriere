name: Publish to npmjs

on:
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Which tag or branch to publish?'
        required: true
        default: 'main'
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test before publish
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
      fail-fast: true
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.publish_tag }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  publish-npm:
    name: Publish unscoped to npmjs
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.publish_tag }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Verify built package loads
        run: pnpm run verify:package
      - run: pnpm publish --access public --provenance --no-git-checks
